<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nouveau joueur — Babyfoot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
--felt: #2f6e4c;
--felt-dark: #275c40;
--wood-dark: #422a1b;
--ink: #1b2a22;
--paper: #f4f1e6;
--brass: #c9a24b;
--red: #d64d3d;
--green-ok: #2f6e4c;
}

* { box-sizing: border-box; }

body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: #182420;
font-family: 'Space Grotesk', sans-serif;
color: var(--ink);
padding: 32px 16px;
}

.auth-card {
width: 100%;
max-width: 360px;
background: linear-gradient(160deg, var(--felt), var(--felt-dark));
border: 3px solid var(--wood-dark);
border-radius: 16px;
box-shadow: 0 18px 40px rgba(0,0,0,0.45);
padding: 28px 24px 24px;
}

.auth-card h1 {
color: var(--paper);
font-size: 20px;
font-weight: 700;
margin: 0 0 4px;
text-align: center;
}

.auth-card .subtitle {
color: #cfe6d8;
font-size: 12.5px;
text-align: center;
margin: 0 0 22px;
}

.field { margin-bottom: 14px; }

.field label {
display: block;
font-size: 11px;
letter-spacing: 0.03em;
color: #cfe6d8;
text-transform: uppercase;
margin-bottom: 6px;
}

.field input {
width: 100%;
font-family: inherit;
font-size: 15px;
font-weight: 500;
padding: 11px 14px;
border: 2px solid var(--wood-dark);
border-radius: 8px;
background: var(--paper);
color: var(--ink);
outline: none;
transition: border-color 0.15s ease;
}

.field input::placeholder { color: #8a8371; }
.field input:focus { border-color: var(--brass); }
.field input.invalid { border-color: var(--red); }
.field input.valid { border-color: var(--green-ok); }

.field .hint {
font-size: 11px;
color: #cfe6d8;
opacity: 0.8;
margin-top: 4px;
min-height: 14px;
}
.field .hint.error { color: #ffb3a8; opacity: 1; }

.submit-btn {
margin-top: 8px;
width: 100%;
font-family: inherit;
font-size: 14.5px;
font-weight: 700;
letter-spacing: 0.02em;
padding: 13px 14px;
border: 2px solid var(--wood-dark);
border-radius: 8px;
background: var(--brass);
color: var(--ink);
cursor: pointer;
transition: filter 0.15s ease;
}
.submit-btn:hover { filter: brightness(1.05); }
.submit-btn:active { filter: brightness(0.95); }
.submit-btn:disabled { cursor: default; filter: grayscale(0.35) brightness(0.9); }

.form-msg {
display: none;
margin: 4px 0 14px;
padding: 9px 12px;
border-radius: 8px;
font-size: 12.5px;
line-height: 1.4;
}
.form-msg.show { display: block; }
.form-msg.error { background: #fbeceb; border: 2px solid var(--red); color: #8a2c22; }
.form-msg.success { background: #eaf5ee; border: 2px solid var(--green-ok); color: #1e4a33; }

.switch-link {
text-align: center;
margin-top: 16px;
font-size: 12.5px;
color: #cfe6d8;
}
.switch-link a {
color: var(--paper);
font-weight: 600;
text-decoration: underline;
text-underline-offset: 2px;
}
</style>
</head>
<body>

<div class="auth-card">
  <h1>Nouveau joueur</h1>
  <p class="subtitle">Crée ton profil pour le babyfoot</p>

  <div class="form-msg" id="joueur-msg"></div>

  <form id="joueur-form" novalidate>
    <div class="field">
      <label for="joueur-name">Nom / pseudo</label>
      <input type="text" id="joueur-name" placeholder="Ton nom" autocomplete="name">
      <div class="hint" id="joueur-name-hint"></div>
    </div>

    <div class="field">
      <label for="joueur-email">Email</label>
      <input type="email" id="joueur-email" placeholder="toi@exemple.com" autocomplete="email">
      <div class="hint" id="joueur-email-hint"></div>
    </div>

    <div class="field">
      <label for="joueur-password">Mot de passe</label>
      <input type="password" id="joueur-password" placeholder="••••••••" autocomplete="new-password">
      <div class="hint" id="joueur-password-hint"></div>
    </div>

    <button type="submit" class="submit-btn" id="joueur-submit" disabled>Créer le compte</button>
  </form>

  <div class="switch-link">
    Déjà un compte ? <a href="connexion.html">Se connecter</a>
  </div>
</div>

<script src="scripts/new_joueur.js"></script>
</body>
</html>
